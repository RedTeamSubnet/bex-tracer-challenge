## 45 extensions in 6 groups, from a list of 89 popular store extensions
## (2026-09-24). Kept: every extension that can possibly leave a trace on the
## bait page - 42 whose manifest lets them run on it, plus 3 that change a
## browser-wide setting a page may observe (1clickVPN, Privacy Test, Clear Cache).
##
## Left out on purpose:
##   - 34 with no page access and nothing browser-wide: no trace, ever.
##   - 10 whose only trace is opening a tab on install: identical to each
##     other, so they cannot be told apart.
##
## NOT YET CALIBRATED. The audit tool is weaker than a real solver, so which of
## these are detectable is decided by a solver run, not assumed. Drop whatever
## a serious attempt cannot detect. `tier` is unset until then.

