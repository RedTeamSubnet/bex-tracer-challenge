challenge:
  pool_path: "/app/rest-exc-challenge/extensions.yml"


  n_rounds: 6
  k: 12
  ## Weight each draw toward least-used extensions; 1.0 = uniform.
  ## Uniform leaves ~2.7 of 25 never enabled per run.
  coverage_bias: 2.0


  max_parallel_rounds: 1

  settle_seconds: 6.0
  script_budget_sec: 10.0
  submission_max_lines: 750
  browser:
    chrome_bin: "/opt/chrome/browser/chrome"
    chromedriver_bin: "/opt/chrome/driver/chromedriver"
    extensions_dir: "/opt/extensions"
    scratch_dir: "/run/exc"
    # Prod is always headless. False only for local dev under Xvfb.
    headless: true
    # Prefer shm_size: 2gb on the container over this flag.
    shm_fallback: false
    page_load_timeout_sec: 30.0
