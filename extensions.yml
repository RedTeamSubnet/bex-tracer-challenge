# Extension pool - the closed world miners are told about.
#
# Every `id` under `pool:` is published to miners via GET /task. A random subset
# of exactly `k` (config, default 5) is enabled per round; miners return a boolean
# per id.
#
# Six fields, and no more:
#   id                 identifies the extension. Not copied from a store URL -
#                      `fetch_extensions.py` derives it from the .crx signing key
#                      and fails the build if it disagrees with this pin.
#   name               a label for humans. Nothing depends on it.
#   group              which submission file (`<group>.js`, `window.detect_<group>`)
#                      answers for this extension. Category, not detection technique -
#                      see docs/PLAN-grouped-submissions.md. Published to miners
#                      via GET /task; must be a valid JS identifier.
#   version + sha256   the pin. A drifted hash fails the build loudly, on purpose.
#   time_to_stable_ms  measured during curation; feeds the settle window. Cannot
#                      be derived from a manifest - it needs a real Chrome run.
#   notes              only where curation has a finding worth carrying.
#
# Manifest facts - manifest_version, web_accessible_resources, use_dynamic_url,
# content scripts, DNR rulesets - are deliberately NOT stored here. They live in
# each extension's manifest, the store re-publishes often, and a copy in yaml
# would be quietly wrong within days. Read them live instead:
#
#     python3 scripts/screen_extensions.py
#
# HARD RULE: manifest_version must be 3. Chrome 152 hard-rejects MV2 - the
# extension never loads and Selenium reports no error. `fetch_extensions.py`
# checks the downloaded manifest and fails the whole build on an MV2 entry, so
# one here makes the image unbuildable. That check reads the real manifest, which
# is why no `manifest_version` field is kept below.
#
# STATUS 2026-09-06: 21 in the pool, 8 rejected. Ids, versions and hashes verified
# against the live store. The six dropped on 2026-09-06 were unearnable - no WAR probe
# path and no measured page-visible signal - so they only added label noise. Reasons
# are recorded under `rejected:`. Original note: candidates verified against the
# live store. Headless signal stability and time_to_stable_ms are NOT yet
# measured - that is the remaining Step 1 work. Entries carrying a SUSPECT note
# are expected to fail curation.

